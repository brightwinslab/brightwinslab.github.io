<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070b18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bright Gaze">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Bright Gaze</title>
<style>
@font-face{font-family:"BG Display";src:url(display.woff2) format("woff2");font-weight:600;font-display:swap}
:root{--ink:#070b18;--navy:#0d1530;--p1:rgba(255,255,255,.04);--p2:rgba(255,255,255,.07);--p3:rgba(255,255,255,.11);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
 --tx:#eef1f8;--tx2:#a3aec6;--tx3:#6f7b97;--gold:#ffc766;--gold2:#ffa94d;--goldink:#1d1405;--look:#62e3b5;--away:#ffbe6b;--rec:#ff7a6b;
 --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--ease:cubic-bezier(.2,.8,.2,1);
 --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;--disp:"BG Display",Georgia,"Times New Roman",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--tx);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{background:radial-gradient(120% 60% at 100% -10%,rgba(255,199,102,.10),transparent 60%),radial-gradient(120% 70% at -20% 110%,rgba(96,104,255,.12),transparent 60%),linear-gradient(180deg,#0b1124,var(--ink) 70%);background-attachment:fixed;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:14px}
.hide{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 12px) 20px 12px;background:linear-gradient(180deg,rgba(7,11,24,.92),rgba(7,11,24,.72));-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid transparent;transition:border-color .3s}
.top.scrolled{border-bottom-color:var(--line)}
.orb{width:30px;height:30px;border-radius:50%;flex:none;background:radial-gradient(circle at 36% 32%,#fff6dc 0,#ffd27a 28%,#ff9f45 72%,#c76a1e 100%);box-shadow:0 0 0 5px rgba(255,199,102,.08),0 0 20px rgba(255,186,90,.5)}
.brand{flex:1;min-width:0;line-height:1.15}.brand b{display:block;font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:.005em}.brand span{font-size:12px;color:var(--tx3)}
.conn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:99px;background:var(--p2);font-size:13px;font-weight:600;color:var(--tx2);white-space:nowrap}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--tx3)}
.conn.on i{background:var(--look);box-shadow:0 0 0 4px rgba(98,227,181,.16)}.conn.on{color:#c9f5e4}
.conn.wait i{background:var(--away)}.conn.off i{background:var(--rec)}
.gear{width:44px;height:44px;margin-right:-8px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.gear:active{background:var(--p2)}

/* ---------- views ---------- */
main{padding:14px 20px calc(var(--sab) + 108px);max-width:620px;margin:0 auto}
.view{animation:viewin .32s var(--ease)}@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-family:var(--disp);font-weight:600;font-size:32px;line-height:1.1;letter-spacing:-.005em;margin:18px 0 6px}
.lede{color:var(--tx2);margin:0 0 20px;font-size:15.5px;max-width:34em}
h2{font-size:17px;font-weight:650;margin:30px 0 12px;display:flex;align-items:baseline;gap:10px}h2 small{font-size:13px;font-weight:500;color:var(--tx3)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:rgba(255,190,107,.08);border:1px solid rgba(255,190,107,.2);color:#ffe2b8;font-size:14.5px;margin:12px 0 4px}
.banner .ic{color:var(--away);margin-top:1px}

/* ---------- the now card (the one bold element) ---------- */
.now{position:relative;overflow:hidden;border-radius:30px;padding:22px 22px 20px;margin-top:10px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);box-shadow:0 30px 60px -36px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.06);isolation:isolate}
.now::before{content:"";position:absolute;inset:-40% -30% auto auto;width:120%;height:140%;background:radial-gradient(closest-side,var(--hue,#ffc766),transparent);opacity:.16;z-index:-1;transition:background .8s,opacity .8s}
.now .where{font-size:13.5px;color:var(--tx2);display:flex;justify-content:space-between;align-items:center;gap:10px}
.timer{font-variant-numeric:tabular-nums;font-weight:600;color:var(--tx);background:rgba(0,0,0,.25);padding:4px 10px;border-radius:99px;font-size:13.5px}
.now .title{font-family:var(--disp);font-weight:600;font-size:34px;line-height:1.08;margin:8px 0 4px;min-height:37px}
.now .sub{color:var(--tx2);font-size:15px;min-height:22px}
.gz{display:flex;align-items:center;gap:16px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.eye{position:relative;width:62px;height:62px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 38% 34%,rgba(255,255,255,.18),rgba(255,255,255,.04) 70%);color:var(--tx3);transition:background .6s,color .6s}
.eye .ic{width:28px;height:28px}
.eye::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid currentColor;opacity:0;transition:opacity .6s}
.eye.look{color:var(--look);background:radial-gradient(circle at 38% 34%,rgba(98,227,181,.45),rgba(98,227,181,.10) 70%)}
.eye.look::after{opacity:.35;animation:breathe 2.8s ease-in-out infinite}
.eye.away{color:var(--away);background:radial-gradient(circle at 38% 34%,rgba(255,190,107,.4),rgba(255,190,107,.08) 70%)}
@keyframes breathe{0%,100%{transform:scale(.94);opacity:.18}50%{transform:scale(1.06);opacity:.45}}
.gz>div:nth-child(2){min-width:0;flex:1}.gz b{display:block;font-size:18px;font-weight:650;white-space:nowrap}.gz>div:nth-child(2) span{display:block;color:var(--tx2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nums{margin-left:auto;display:flex;gap:16px;text-align:right}.nums div{display:flex;flex-direction:column}.nums b{font-size:20px;font-variant-numeric:tabular-nums}.nums span{font-size:12.5px;color:var(--tx3)}
.now.asleep .title{color:var(--tx2)}

/* controls */
.ctl{display:grid;grid-template-columns:1fr 76px 76px;gap:10px;margin-top:14px}
.b{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:0 18px;border-radius:22px;background:var(--p2);border:1px solid var(--line);font-weight:650;font-size:16.5px;transition:transform .15s var(--ease),background .2s,opacity .2s;user-select:none;-webkit-user-select:none}
.b:active{transform:scale(.96);background:var(--p3)}
.b.gold{background:linear-gradient(160deg,#ffd98a,#ffac4a);color:var(--goldink);border-color:transparent;box-shadow:0 14px 30px -14px rgba(255,170,70,.75),inset 0 1px 0 rgba(255,255,255,.55)}
.b.gold:active{filter:brightness(.96)}
.b.col{flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--tx2);padding:0}.b.col .ic{color:var(--tx)}
.b[disabled]{opacity:.38;pointer-events:none}
.b.sm{min-height:48px;border-radius:16px;font-size:15px;padding:0 16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.row2>.b{white-space:nowrap;font-size:15.5px;padding:0 12px}
.say{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.say .b{justify-content:flex-start;padding:0 16px;font-size:15.5px}.say .b .ic{color:var(--gold)}
.vol{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:22px;background:var(--p1);border:1px solid var(--line);margin-top:10px;color:var(--tx2)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:36px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--gold) var(--p,50%),rgba(255,255,255,.12) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;margin-top:-11px;background:#fff7e6;box-shadow:0 4px 14px rgba(0,0,0,.5),0 0 0 6px rgba(255,199,102,.15)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:rgba(255,255,255,.12)}input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--gold)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff7e6}

/* activity tiles */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{position:relative;display:block;text-align:left;border-radius:22px;overflow:hidden;background:var(--p1);border:1px solid var(--line);transition:transform .18s var(--ease)}
.act:active{transform:scale(.97)}
.act .art{aspect-ratio:7/6;background:radial-gradient(90% 90% at 30% 20%,color-mix(in srgb,var(--hue) 55%,#fff 0%),color-mix(in srgb,var(--hue) 30%,#0b1124) 75%);background-size:cover;background-position:center}
.act .nm{padding:11px 14px 13px;font-weight:650;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.act.on{border-color:color-mix(in srgb,var(--hue) 70%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--hue) 25%,transparent)}
.act .playing{font-size:11.5px;font-weight:700;color:var(--goldink);background:var(--gold);padding:3px 8px;border-radius:99px}
.act.off .art{filter:saturate(.4) brightness(.7)}
.feed{margin-top:8px}.feed div{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--tx2)}.feed div:last-child{border-bottom:0}.feed time{color:var(--tx3);font-variant-numeric:tabular-nums}

/* one status line */
.gz .stl{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.gz .stl>span{display:block;min-width:0;font-size:15.5px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* collapsible sections */
details.sec{margin-top:30px;border-radius:22px;background:var(--p1);border:1px solid var(--line)}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:16px 18px;font-weight:650;font-size:17px;cursor:pointer;min-height:56px}
details.sec>summary::-webkit-details-marker{display:none}details.sec>summary .ic{width:18px;height:18px;color:var(--tx3);transition:transform .25s var(--ease)}details.sec[open]>summary .ic{transform:rotate(90deg)}
details.sec>summary small{margin-left:auto;font-size:13px;font-weight:500;color:var(--tx3);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
details.sec>summary small.play{color:var(--gold)}
details.sec>.in{padding:2px 14px 16px}
/* prompt feedback */
.say .b{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}.say .b>span{display:flex;align-items:center;gap:10px}
.say .fb{font-size:12.5px;font-weight:600;color:var(--tx3);min-height:16px;padding-left:32px;transition:color .2s}.say .fb.wait{color:var(--away)}.say .fb.ok{color:var(--look)}.say .fb.no{color:var(--rec)}
/* activity placeholders before the first sync */
.act .art.ph{display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.88)}.act .art.ph .ic{width:46px;height:46px;stroke-width:1.5;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
/* levels */
.lvr{padding:12px 4px 14px;border-bottom:1px solid var(--line)}.lvr:last-of-type{border-bottom:0}
.lvh{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}.lvh b{font-weight:650;font-size:15.5px}.lvh small{font-size:13px;color:var(--tx3)}
.lvh .lvs{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--tx3);white-space:nowrap}.lvh .lvs.fx{color:var(--gold)}.lvh .lvs.cg{color:#c9b8ff}.lvh .lvs.sv{color:var(--look)}
.lvd{width:9px;height:9px;border-radius:50%;background:var(--hue,#ffc766);box-shadow:0 0 10px -1px var(--hue,#ffc766);flex:none;align-self:center}
.segp{display:flex;gap:4px;padding:4px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid var(--line)}
.segp button{flex:1;min-width:0;height:44px;border-radius:12px;font-size:15px;font-weight:650;color:var(--tx2);transition:background .2s,color .2s}
.segp button.on{background:linear-gradient(160deg,#ffd98a,#ffac4a);color:var(--goldink);box-shadow:0 6px 16px -8px rgba(255,170,70,.8)}
.segp button.cg{color:#bfb0f0}.segp button.cg.on{background:linear-gradient(160deg,#d9ccff,#a993f5);color:#160d33}
.segp button.pend{animation:pend 1s ease-in-out infinite}@keyframes pend{50%{opacity:.55}}
.segp button[disabled]{opacity:.4}.segp i{width:1px;margin:6px 2px;background:var(--line2);flex:none}
.segp.calm button{font-size:14.5px}
.lvnote{font-size:13px;color:var(--tx3);margin:10px 4px 0}.lvnote b{color:#c9b8ff;font-weight:650}
/* last session */
.last{border-radius:22px;background:var(--p1);border:1px solid var(--line);padding:16px 18px}
.last .lh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.last .lh b{font-weight:650;font-size:15.5px}.last .lh span{font-size:13px;color:var(--tx3)}
.l3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}.l3 div{padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.04)}
.l3 b{display:block;font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2}.l3 span{font-size:12.5px;color:var(--tx3)}
.last .lf{font-size:14px;color:var(--tx2);margin-top:8px;display:flex;align-items:center;gap:8px}.last .lf .lvd{align-self:center}

/* ---------- lists (voices) ---------- */
.list{border-radius:22px;background:var(--p1);border:1px solid var(--line);overflow:hidden}
.vr{border-bottom:1px solid var(--line)}.vr:last-child{border-bottom:0}
.vh{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 18px;min-height:68px}
.vh .lbl{flex:1;min-width:0}.vh .lbl b{display:block;font-weight:600;font-size:15.5px;line-height:1.3}.vh .lbl span{font-size:13px;color:var(--tx3)}
.vh .lbl span.fam{color:var(--gold)}
.ib{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:var(--p2);flex:none;transition:transform .15s var(--ease)}
.ib:active{transform:scale(.92);background:var(--p3)}
.ib.mic{background:rgba(255,122,107,.12);color:#ffb3a8}
.ib.play.on{color:var(--gold)}
.vx{padding:0 16px 14px 18px;display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 4px 0 12px;border-radius:13px;background:var(--p2);font-size:13.5px;color:var(--tx2)}
.chip button{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center}.chip button:active{background:var(--p3)}.chip .ic{width:18px;height:18px}
.grp{margin-top:12px}
.grp summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 2px;font-weight:650;cursor:pointer}
.grp summary::-webkit-details-marker{display:none}.grp summary .ic{width:18px;height:18px;color:var(--tx3);transition:transform .25s var(--ease)}.grp[open] summary .ic{transform:rotate(90deg)}
.grp summary small{color:var(--tx3);font-weight:500;font-size:13px;margin-left:auto}

/* ---------- photos ---------- */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.ph{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--p2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}.ph img.ok{opacity:1}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:12.5px;font-weight:600;text-align:left;color:#fff;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .mic{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(7,11,24,.6);display:flex;align-items:center;justify-content:center;color:var(--gold)}.ph .mic .ic{width:13px;height:13px}
.viewer .vf{width:100%;max-width:420px;margin-top:16px;display:flex;flex-direction:column;gap:10px}.viewer .vm{display:flex;gap:8px;align-items:center}.viewer .vm .b{flex:1;white-space:nowrap;font-size:14.5px;padding:0 12px}
.ph.up::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%);background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{from{background-position:150% 0}to{background-position:-50% 0}}
.empty{padding:34px 22px;text-align:center;color:var(--tx2);border:1px dashed var(--line2);border-radius:22px;margin-top:16px}
.empty .ic{width:40px;height:40px;color:var(--tx3);stroke-width:1.3;margin-bottom:8px}

/* ---------- insights ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:16px 18px;border-radius:20px;background:var(--p1);border:1px solid var(--line)}.tile b{display:block;font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2}.tile span{font-size:13.5px;color:var(--tx2)}
.chart{border-radius:22px;background:var(--p1);border:1px solid var(--line);padding:16px 14px 10px}
.chart svg{display:block;width:100%;height:auto}
.ses{display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.ses:last-child{border-bottom:0}
.ses .d{width:46px;text-align:center;flex:none;line-height:1.1}.ses .d b{display:block;font-size:19px}.ses .d span{font-size:11.5px;color:var(--tx3)}
.ses .m{flex:1;min-width:0}.ses .m b{font-weight:600;font-size:15px}.ses .m span{display:block;font-size:13px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ses .r{text-align:right;font-size:13px;color:var(--tx2)}.ses .r b{display:block;font-size:16px;color:var(--tx)}
.hbar{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:10px 2px}.hbar i{grid-column:1/-1;height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden}.hbar i::before{content:"";display:block;height:100%;width:var(--w);background:var(--hue);border-radius:8px}
.hbar span{font-size:14.5px}.hbar b{font-size:13.5px;color:var(--tx2);font-weight:600}
.note{font-size:13px;color:var(--tx3);margin-top:12px}

/* ---------- screen recording ---------- */
.recc{margin-top:10px;padding:16px;border-radius:22px;background:var(--p1);border:1px solid var(--line)}
.recrow{display:flex;gap:10px}
.b.recb{flex:1}.b.recb i{width:12px;height:12px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 4px rgba(255,122,107,.18)}
.b.recb.on{background:rgba(255,122,107,.14);border-color:rgba(255,122,107,.45);color:#ffd7d0;font-variant-numeric:tabular-nums}.b.recb.on i{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.tog{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tg{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:14px;background:var(--p2);font-size:14px;font-weight:600;color:var(--tx2);transition:background .2s,color .2s}
.tg i{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--tx3);display:flex;align-items:center;justify-content:center}

/* ---------- state ---------- */

 try{const r=await fetch(CFG.url+'/functions/v1/gaze',{method:'POST',headers:{'content-type':'application/json',apikey:CFG.key},body:JSON.stringify(Object.assign({a,token:S.st.token},body)),signal:ctl.signal});

V.videos=()=>{const L=S.files.filter(f=>f.kind==='video').sort((a,b)=>b.rev-a.rev),used=L.reduce((a,f)=>a+(f.size||0),0),cap=600*1048576,th=(S.backup&&S.backup.thumbs)||{};
 const hue=id=>(acts().find(x=>x.id===id)||{}).hue||'#ffc766';
 return `<h1>Videos</h1><p class="lede">Screen recordings of her playing, made from the Remote screen or on the Tobii. The newest 600 MB are kept; the oldest are removed first.</p>
 ${L.length?`<div class="meter" aria-label="Storage used"><i style="width:${Math.min(100,used/cap*100).toFixed(1)}%"></i></div><p class="note" style="margin:0 0 16px">${fmtMB(used)} of 600 MB used</p>
 <div class="list">${L.map(f=>{const m=f.meta||{},d=new Date(m.at||f.created_at);return `<div class="vid"><button class="th" data-vp="${esc(f.id)}" aria-label="Play" style="--hue:${esc(hue(m.act))};${th[m.act]?`background-image:url('${th[m.act]}')`:''}"></button>
  <div class="m"><b>${esc(m.title||f.name||'Bright Gaze')}</b><span>${d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})}, ${d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</span><span>${fmtT(m.dur||0)} · ${fmtMB(f.size||0)}${m.face?' · with her face':''}</span></div>
  <button class="ib" data-vd="${esc(f.id)}" aria-label="Download">${ic('dl')}</button><button class="ib" data-vx="${esc(f.id)}" aria-label="Delete">${ic('trash')}</button></div>`}).join('')}</div>`
 :`<div class="empty">${ic('videos')}<div>No videos yet. On the Remote screen, tap Record while she plays.</div></div>`}`};
B.videos=()=>{$('#main').onclick=e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.vp)playVideo(t.dataset.vp);else if(t.dataset.vd)saveVideo(t.dataset.vd);else if(t.dataset.vx)delFile(t.dataset.vx,'Delete this video from the family cloud? A copy may still be in the Tobii’s Downloads folder.')}};
S.vb={};
async function fetchVideo(id,onp){if(S.vb[id])return S.vb[id];const f=S.files.find(x=>x.id===id);const r=await api('down_url',{ids:[id]});const P=(r.parts&&r.parts[id])||(r.urls&&r.urls[id]?[r.urls[id]]:null);
 if(!P){const e=new Error('gone');e.code='server';throw e}const out=[];let got=0;const total=(f&&f.size)||1;
 for(const u of P){const res=await fetch(u);if(!res.ok){const e=new Error('dl');e.code='storage';throw e}
  if(res.body&&res.body.getReader){const rd=res.body.getReader(),ch=[];for(;;){const {done,value}=await rd.read();if(done)break;ch.push(value);got+=value.length;onp&&onp(Math.min(1,got/total))}out.push(new Blob(ch))}
  else{const b=await res.blob();got+=b.size;onp&&onp(Math.min(1,got/total));out.push(b)}}
 const blob=new Blob(out,{type:(f&&f.mime)||'video/webm'});S.vb={[id]:blob};return blob}
function vName(f){const m=f.meta||{},d=new Date(m.at||f.created_at),p=n=>String(n).padStart(2,'0');return `Bright-Gaze-${String(m.title||'video').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')}-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.webm`}
function playVideo(id){const f=S.files.find(x=>x.id===id)||{},m=f.meta||{};let url=null;
 const {sh,close}=sheet(`<h3>${esc(m.title||'Video')}</h3><p class="hint">${new Date(m.at||f.created_at).toLocaleString([],{weekday:'long',hour:'numeric',minute:'2-digit'})} · ${fmtT(m.dur||0)}</p><div class="player" id="pl"><div class="prog"><i id="pp"></i></div><p class="hint" id="pm">Loading ${fmtMB(f.size||0)}…</p></div>
  <div class="row2"><button class="b sm" id="pdl">${ic('dl')}<span>Download</span></button><button class="b sm" id="pcl">Close</button></div>`,()=>{if(url)URL.revokeObjectURL(url)});
 $('#pcl',sh).onclick=close;$('#pdl',sh).onclick=()=>saveVideo(id);
 fetchVideo(id,p=>{const b=$('#pp',sh);if(b)b.style.width=(p*100).toFixed(0)+'%'}).then(blob=>{url=URL.createObjectURL(blob);const v=document.createElement('video');v.controls=true;v.playsInline=true;v.src=url;
  v.onloadedmetadata=()=>{if(v.duration===Infinity){v.currentTime=1e7;v.ontimeupdate=()=>{v.ontimeupdate=null;v.currentTime=0}}};
  v.onerror=()=>{$('#pl',sh).innerHTML=`<p class="hint">This phone can’t play WebM videos. Tap Download and open the file in an app such as VLC.</p>`};
  const pl=$('#pl',sh);pl.innerHTML='';pl.appendChild(v);v.play().catch(()=>{})}).catch(e=>{const pm=$('#pm',sh);if(pm)pm.textContent=errText(e.code)})}
async function saveVideo(id){const f=S.files.find(x=>x.id===id)||{};toast('Getting the video…',6000);
 try{const blob=await fetchVideo(id);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=vName(f);document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},60000);toast('Downloaded')}catch(e){toast(errText(e.code))}}

/* ---------- Insights ---------- */
V.insights=()=>{const b=S.backup;const ss=((b&&b.sessions)||[]).filter(s=>s&&s.start).sort((x,y)=>x.start-y.start);
 if(!ss.length)return `<h1>Insights</h1><p class="lede">After her first session you’ll see how long she looked, and which activities hold her attention.</p><div class="empty">${ic('insights')}<div>No sessions yet.</div></div>`;
 const wk=Date.now()-7*864e5,W=ss.filter(s=>s.start>=wk),sum=(L,k)=>L.reduce((a,s)=>a+(+s[k]||0),0);
 const actT=id=>{const a=((b&&b.acts)||[]).find(x=>x.id===id);return a?a.title:({home:'Playroom',quiet:'Quiet corner',goodbye:'Goodbye'})[id]||id};
 const last=ss.slice(-12),mx=Math.max(1,...last.map(s=>(s.look||0)/60));
 const bars=last.map((s,i)=>{const m=(s.look||0)/60,h=Math.max(4,m/mx*120),x=12+i*(296/last.length),w=Math.min(18,296/last.length*.55);return `<rect x="${x.toFixed(1)}" y="${(140-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${(w/2).toFixed(1)}" fill="url(#bg)"/>`}).join('');
 const per={};ss.forEach(s=>(s.scenes||[]).forEach(x=>{if(['home','quiet','goodbye'].includes(x.id))return;per[x.id]=per[x.id]||{look:0,dur:0};per[x.id].look+=+x.look||0;per[x.id].dur+=+x.dur||0}));
 const fav=Object.entries(per).filter(([,v])=>v.dur>=10).map(([k,v])=>[k,v.look/v.dur*60]).sort((a,b)=>b[1]-a[1]).slice(0,6),fm=Math.max(1,...fav.map(f=>f[1]));
 const hue=id=>(((b&&b.acts)||[]).find(x=>x.id===id)||{}).hue||'#ffc766';
 return `<h1>Insights</h1><p class="lede">From the Tobii’s last sync${S.backupAt?', '+ago(Date.parse(S.backupAt)):''}. Based on where the pointer was, so treat it as a guide.</p>
 <div class="tiles"><div class="tile"><b>${W.length}</b><span>sessions this week</span></div><div class="tile"><b>${(sum(W,'look')/60).toFixed(1)}</b><span>minutes looking this week</span></div>
  <div class="tile"><b>${sum(W,'hits')}</b><span>successful looks this week</span></div><div class="tile"><b>${W.reduce((a,s)=>a+((s.lapses||[]).length),0)}</b><span>look-aways this week</span></div></div>
 <h2>Minutes looking <small>last ${last.length} sessions</small></h2><div class="chart"><svg viewBox="0 0 320 150" role="img" aria-label="Minutes looking per session"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff9f45" stop-opacity=".5"/></linearGradient></defs><line x1="6" y1="141" x2="314" y2="141" stroke="rgba(255,255,255,.12)" stroke-width="1.5"/>${bars}</svg></div>
 ${fav.length?`<h2>What holds her look <small>seconds per minute</small></h2><div class="list" style="padding:6px 16px">${fav.map(([k,v])=>`<div class="hbar" style="--hue:${esc(hue(k))};--w:${(v/fm*100).toFixed(0)}%"><span>${esc(actT(k))}</span><b>${Math.round(v)}</b><i></i></div>`).join('')}</div>`:''}
 <h2>Recent sessions</h2><div class="list">${ss.slice(-8).reverse().map(s=>{const d=new Date(s.start);const sc=[...new Set((s.scenes||[]).map(x=>x.id).filter(x=>!['home','quiet','goodbye'].includes(x)))].map(actT);
  return `<div class="ses"><div class="d"><b>${d.getDate()}</b><span>${d.toLocaleDateString([],{month:'short'})}</span></div><div class="m"><b>${s.free?'Free play':'Session'} at ${d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</b><span>${esc(sc.join(', ')||'—')}</span></div><div class="r"><b>${fmtDur(s.dur)}</b>${s.hits||0} looks</div></div>`}).join('')}</div>`};
const ago=t=>{if(!t)return'never';const s=Math.round((Date.now()-t)/1000);return s<60?'just now':s<3600?Math.round(s/60)+' min ago':s<86400?Math.round(s/3600)+' h ago':new Date(t).toLocaleDateString()};

/* ---------- Settings ---------- */
function settings(){const D=S.st.devices||[];
 const {sh,close}=sheet(`<h3>Settings</h3>
  <div class="field"><label for="me">Your name</label><input class="txt" id="me" maxlength="24" placeholder="For example, Mom" value="${esc(S.st.me||'')}" autocomplete="off"><span class="note" style="margin:0">Shown next to the recordings you make.</span></div>
  <h2 style="margin-top:22px">Paired devices</h2><div>${D.map(d=>`<div class="dev"><div class="di">${ic(d.kind==='phone'?'phone':'tablet')}</div><div class="dl"><b>${esc(d.label||(d.kind==='phone'?'Phone':'Tobii'))}${d.me?'<span class="tag">This phone</span>':''}</b><span>${d.kind==='phone'?'Phone':'Tobii'}, seen ${ago(Date.parse(d.last_seen))}</span></div>${d.me?'':`<button class="ib" data-rm="${esc(d.id)}" aria-label="Remove">${ic('trash')}</button>`}</div>`).join('')}</div>
  <h2 style="margin-top:22px">Link a Tobii</h2><p class="hint">Installed a new version of Bright Gaze? Open Phone on it and type its code here. It gets back her voices, photos, settings and sessions.</p>
  <div class="row2" style="grid-template-columns:1fr auto"><input class="txt" id="lk" inputmode="numeric" pattern="[0-9]*" maxlength="7" placeholder="6-digit code" autocomplete="one-time-code"><button class="b sm gold" id="lkb">${ic('link')}<span>Link</span></button></div>
  <h2 style="margin-top:26px">This phone</h2><div class="row2"><button class="b sm" id="unp">Unpair this phone</button><button class="b sm" id="rl">Refresh</button></div>
  <p class="note">Bright Gaze by Bright Wins Lab. Only phones paired with a code from the Tobii can see or change anything.</p>`);
 const me=$('#me',sh);me.onchange=me.onblur=()=>{S.st.me=me.value.trim().slice(0,24);save()};
 $$('[data-rm]',sh).forEach(b=>b.onclick=async()=>{if(!confirm('Remove this device? It will no longer control Bright Gaze or see the family’s voices and photos.'))return;try{await api('revoke',{device_id:b.dataset.rm});close();await loadAll();toast('Removed')}catch(e){toast(errText(e.code))}});
 $('#lkb',sh).onclick=async()=>{const c=$('#lk',sh).value.replace(/\D/g,'');if(c.length!==6){toast('Type the 6 digits shown on the Tobii.');return}
  try{const r=await api('pair_claim',{code:c,label:(S.st.me?S.st.me+'’s phone':'Phone')});applyInfo(r);close();toast(r.joined==='phone'?'Linked. The Tobii is bringing everything back.':'Linked');setTimeout(()=>loadAll(true),4000)}catch(e){toast(errText(e.code))}};
 $('#unp',sh).onclick=async()=>{if(!confirm('Unpair this phone? Voices and photos stay with the Tobii and the family cloud.'))return;try{await api('revoke',{})}catch(e){}close();lost()};
 $('#rl',sh).onclick=()=>{close();loadAll()}}

/* ---------- Pair ---------- */
function isIOS(){return /iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function pairHTML(){const pre=(location.hash.match(/pair=(\d{6})/)||[])[1]||'';const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
 return `<div class="pair view"><div class="orb big" aria-hidden="true"></div><h1>Bright Gaze</h1><p class="lede">Control her screen from across the room, and record your voice for her activities.</p>
 <ol class="steps"><li>On the Tobii, tap the top-right corner three times to open the caregiver screen.</li><li>Choose <b>Phone</b>. A six-digit code appears.</li><li>Type it here.</li></ol>
 <div class="code" id="code">${[0,1,2,3,4,5].map(i=>`<div class="c"></div>`).join('')}<input id="ci" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" aria-label="Pairing code" value="${pre}"></div>
 <div class="msg" id="msg"></div><button class="b gold" id="pb" style="width:100%">${ic('link')}<span>Pair with the Tobii</span></button>
 ${isIOS()&&!standalone?`<div class="banner" style="margin-top:22px">${ic('phone')}<div>Tip: add this page to your Home Screen first (Share, then Add to Home Screen) and pair from there. It opens like an app.</div></div>`:''}
 <div class="foot">Bright Gaze · Bright Wins Lab<br>Private to your family. No account needed.</div></div>`}
function bindPair(){const ci=$('#ci'),boxes=$$('#code .c'),msg=$('#msg'),pb=$('#pb');
 const paint=()=>{const v=ci.value.replace(/\D/g,'').slice(0,6);if(v!==ci.value)ci.value=v;boxes.forEach((b,i)=>{b.textContent=v[i]||'';b.classList.toggle('f',!!v[i]);b.classList.toggle('cur',document.activeElement===ci&&i===Math.min(v.length,5))})};
 ci.oninput=()=>{paint();msg.textContent='';if(ci.value.length===6)go()};ci.onfocus=ci.onblur=paint;paint();
 async function go(){const c=ci.value;if(c.length!==6){msg.textContent='Type the 6 digits shown on the Tobii.';return}pb.disabled=true;pb.innerHTML='<i class="spin"></i>';
  try{const r=await api('pair_claim',{code:c,label:'Phone'});applyInfo(r);history.replaceState(null,'',location.pathname+location.search);msg.className='msg ok';msg.textContent='Paired';buzz();
   setTimeout(()=>{render();live(true);loadAll(true)},450)}
  catch(e){pb.disabled=false;pb.innerHTML=ic('link')+'<span>Pair with the Tobii</span>';msg.className='msg';msg.textContent=errText(e.code);const cd=$('#code');cd.classList.remove('shake');void cd.offsetWidth;cd.classList.add('shake');if(e.code==='wrong_code'){ci.value='';paint()}ci.focus()}}
 pb.onclick=go;if(ci.value.length===6){msg.className='msg ok';msg.textContent='Code from the Tobii filled in. Tap Pair.'}else setTimeout(()=>ci.focus(),300)}

/* ---------- lifecycle ---------- */
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&paired()){live();hi();if(Date.now()-S.lastLoad>30000)loadAll(true)}});
addEventListener('online',()=>{if(paired()){live(true);loadAll(true)}render()});addEventListener('offline',()=>{paintConn();if(S.st.tab==='remote')show('remote',true)});
addEventListener('hashchange',()=>{if(!paired())render()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
async function linkFromHash(){const c=(location.hash.match(/pair=(\d{6})/)||[])[1];if(!c||!paired())return;history.replaceState(null,'',location.pathname+location.search);
 if(!confirm('Link this Tobii to your family? It gets her voices, photos, settings and sessions.'))return;
 try{const r=await api('pair_claim',{code:c,label:S.st.me?S.st.me+'’s phone':'Phone'});applyInfo(r);toast('Linked. The Tobii is bringing everything back.');setTimeout(()=>loadAll(true),4000)}catch(e){toast(errText(e.code))}}
addEventListener('hashchange',linkFromHash);
render();if(paired()){live();loadAll(true);linkFromHash()}
</script>
</body>
